name: Automated tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Godot tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '4.7.1'
      GODOT_SHA512: '4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install official Godot binary
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          release_url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}"
          install_dir="${RUNNER_TEMP}/godot"

          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive}" "${release_url}"
          echo "${GODOT_SHA512}  ${RUNNER_TEMP}/${archive}" | sha512sum --check --strict

          mkdir -p "${install_dir}"
          unzip -q "${RUNNER_TEMP}/${archive}" -d "${install_dir}"
          mv "${install_dir}/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "${install_dir}/godot"
          chmod +x "${install_dir}/godot"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/godot" --version

      - name: Run automated tests
        run: sh tools/run_tests.sh
